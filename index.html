<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE ECHO - Voice Lab v1.3</title>
  <style>
    :root { var(--bg: #0f172a; var(--card: #1e293b; }
    body {
      margin: 0; padding: 16px; background-color: #0f172a; color: #fff;
      font-family: system-ui, -apple-system, sans-serif; min-height: 100dvh;
      box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
    }
    h1 { font-size: 1rem; margin-bottom: 2px; color: #94a3b8; }
    .title { font-size: 1.3rem; font-weight: 800; margin-bottom: 12px; }
    .test-banner {
      background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8;
      padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold;
      margin-bottom: 12px; text-align: center; width: 100%; max-width: 400px; box-sizing: border-box;
    }
    .controls { width: 100%; max-width: 400px; margin-bottom: 16px; }
    button {
      width: 100%; padding: 16px; border: none; border-radius: 12px;
      font-size: 1.1rem; font-weight: bold; cursor: pointer; background: #3b82f6; color: white;
    }
    button.listening { background: #ef4444; }
    .flash-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.85); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.15s ease-out;
    }
    .flash-overlay.active { opacity: 1; }
    .flash-emoji { font-size: 6rem; }
    .flash-text { font-size: 1.8rem; font-weight: bold; margin-top: 10px; color: #fff; }
    .log-container {
      width: 100%; max-width: 400px; flex: 1; background: #1e293b;
      border-radius: 16px; padding: 16px; box-sizing: border-box; overflow-y: auto; max-height: 45vh;
    }
    .log-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; }
    .log-time { font-size: 0.8rem; color: #64748b; font-family: monospace; }
    .log-emoji { font-size: 1.4rem; }
    .log-body { flex: 1; display: flex; flex-direction: column; }
    .log-text { font-size: 0.95rem; font-weight: 600; color: #f8fafc; }
    .log-tag { font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>

  <h1>PULSE ECHO VOICE-FIRST</h1>
  <div class="title">🎙️ 音作動切り分けテスト v1.3</div>

  <div class="test-banner">
    🧪 再スタート間隔：1000ms（1秒）設定中
  </div>

  <div class="controls">
    <button id="micBtn">🎙️ 観戦テストスタート</button>
  </div>

  <div class="log-container" id="logContainer">
    <div style="text-align:center; color:#64748b; font-size:0.85rem; padding-top:20px;">
      ログがここに表示されます
    </div>
  </div>

  <div class="flash-overlay" id="flashOverlay">
    <div class="flash-emoji" id="flashEmoji">🔥</div>
    <div class="flash-text" id="flashText">ナイスー！</div>
  </div>

  <script>
    const DICTIONARY = [
      { emoji: "🔥", bg: "#ff4757", keywords: ["よっしゃ", "よし", "神", "ナイス", "いけ", "すごい", "ゴール", "入った", "うま", "完璧", "きた"], defaultTag: "#ナイス" },
      { emoji: "😅", bg: "#70a1ff", keywords: ["なんでやねん", "なんで", "あちゃ", "やってもた", "あかん", "おしい", "惜しい", "欲しい", "ミス", "うそやん", "まじか", "どんまい"], defaultTag: "#惜しい" },
      { emoji: "😳", bg: "#ffa502", keywords: ["マジ", "まじ", "えぐ", "エグい", "やば", "ヤバい", "うそろ", "嘘だろ", "は？"], defaultTag: "#マジか" },
      { emoji: "🤖", bg: "#2ed573", keywords: ["シュート", "パス", "キーパー", "カット", "コーナー", "ファール", "カウンター", "カウント", "フリーキック"], defaultTag: "#ボイス" }
    ];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isListening = false;
      let startTime = null;

      const micBtn = document.getElementById('micBtn');
      const logContainer = document.getElementById('logContainer');
      const flashOverlay = document.getElementById('flashOverlay');
      const flashEmoji = document.getElementById('flashEmoji');
      const flashText = document.getElementById('flashText');

      micBtn.addEventListener('click', () => {
        if (!isListening) {
          recognition.start();
          startTime = new Date();
          isListening = true;
          micBtn.textContent = "🛑 測定中（叫んでみてね）";
          micBtn.classList.add('listening');
        } else {
          isListening = false;
          recognition.stop();
          micBtn.textContent = "🎙️ 観戦テストスタート";
          micBtn.classList.remove('listening');
        }
      });

      // アニキ指定：再スタートまでの間隔を1000ms（1秒）に伸ばして音の頻度変化を検証
      recognition.onend = () => {
        if (isListening) {
          setTimeout(() => {
            if (isListening) {
              try { recognition.start(); } catch(e){}
            }
          }, 1000);
        }
      };

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            const rawText = event.results[i][0].transcript.trim();
            if (rawText.length > 0) processSpeech(rawText);
          }
        }
      };

      function processSpeech(rawText) {
        let matched = null;
        for (const item of DICTIONARY) {
          for (const kw of item.keywords) {
            if (rawText.includes(kw)) {
              matched = { emoji: item.emoji, bg: item.bg, tag: `#${kw}`, rawText: rawText };
              break;
            }
          }
          if (matched) break;
        }
        if (!matched) {
          matched = { emoji: "🤖", bg: "#2ed573", tag: "#ボイス", rawText: rawText };
        }
        triggerFlash(matched);
        addLog(matched);
      }

      function triggerFlash(data) {
        flashEmoji.textContent = data.emoji;
        flashText.textContent = data.rawText;
        flashOverlay.style.background = data.bg + "ee";
        flashOverlay.classList.add('active');
        setTimeout(() => flashOverlay.classList.remove('active'), 600);
      }

      function addLog(data) {
        const now = new Date();
        const diffSec = Math.floor((now - startTime) / 1000);
        const min = String(Math.floor(diffSec / 60)).padStart(2, '0');
        const sec = String(diffSec % 60).padStart(2, '0');

        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div class="log-time">${min}:${sec}</div>
          <div class="log-emoji">${data.emoji}</div>
          <div class="log-body">
            <div class="log-text">${data.rawText}</div>
            <div class="log-tag">${data.tag}</div>
          </div>
        `;
        if (logContainer.children.length === 1 && logContainer.children[0].tagName === 'DIV') logContainer.innerHTML = '';
        logContainer.insertBefore(item, logContainer.firstChild);
      }
    }
  </script>
</body>
</html>
