<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE ECHO - Voice Lab v1.2</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { font-size: 1.1rem; margin-bottom: 2px; color: #94a3b8; }
    .title { font-size: 1.4rem; font-weight: 800; margin-bottom: 12px; }

    .sync-guide {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid #fbbf24;
      color: #fbbf24;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    .controls { width: 100%; max-width: 400px; margin-bottom: 16px; }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    button.listening { background: #ef4444; animation: pulse 1.5s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .flash-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease-out;
    }
    .flash-overlay.active { opacity: 1; }
    .flash-emoji { font-size: 6rem; }
    .flash-text { font-size: 1.8rem; font-weight: bold; margin-top: 10px; color: #fff; text-align: center; padding: 0 16px; }

    .log-container {
      width: 100%;
      max-width: 400px;
      flex: 1;
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
      max-height: 45vh;
    }
    .log-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .log-time { font-size: 0.8rem; color: #64748b; font-family: monospace; }
    .log-emoji { font-size: 1.4rem; }
    .log-body { flex: 1; display: flex; flex-direction: column; }
    .log-text { font-size: 0.95rem; font-weight: 600; color: #f8fafc; }
    .log-tag { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    .interim-box {
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: #38bdf8;
      height: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>PULSE ECHO VOICE-FIRST</h1>
  <div class="title">🎙️ 音声感情検知テスト v1.2</div>

  <div class="sync-guide">
    ⏱️ テレビ動画再生と【同時】にスタートを押してね！
  </div>

  <div class="controls">
    <button id="micBtn">🎙️ 動画再生と同時にスタート</button>
  </div>

  <div id="interimText" class="interim-box">ボタンを押してテレビに向かって叫んでね！</div>

  <div class="log-container" id="logContainer">
    <div style="text-align:center; color:#64748b; font-size:0.85rem; padding-top:20px;">
      叫んだ言葉（原文）と判定タグが分離して記録されます！
    </div>
  </div>

  <div class="flash-overlay" id="flashOverlay">
    <div class="flash-emoji" id="flashEmoji">🔥</div>
    <div class="flash-text" id="flashText">ナイスー！</div>
  </div>

  <script>
    const DICTIONARY = [
      {
        emoji: "🔥",
        bg: "#ff4757",
        keywords: ["よっしゃ", "よし", "神", "ナイス", "いけ", "すごい", "ゴール", "入った", "うま", "完璧", "きた"],
        defaultTag: "#ナイス"
      },
      {
        emoji: "😅",
        bg: "#70a1ff",
        // ChatGPT案採用: 誤認識の文脈（欲しい/カウント等）はあえて生の辞書へ無理に混ぜず、判定用のみ対応
        keywords: ["なんでやねん", "なんで", "あちゃ", "やってもた", "あかん", "おしい", "惜しい", "欲しい", "ミス", "うそやん", "まじか", "どんまい"],
        defaultTag: "#惜しい"
      },
      {
        emoji: "😳",
        bg: "#ffa502",
        keywords: ["マジ", "まじ", "えぐ", "エグい", "やば", "ヤバい", "うそろ", "嘘だろ", "は？"],
        defaultTag: "#マジか"
      },
      {
        emoji: "🤖",
        bg: "#2ed573",
        keywords: ["シュート", "パス", "キーパー", "カット", "コーナー", "ファール", "カウンター", "カウント"],
        defaultTag: "#ボイス"
      }
    ];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("ChromeまたはSafariでお試しください！");
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isListening = false;
      let startTime = null;

      const micBtn = document.getElementById('micBtn');
      const interimText = document.getElementById('interimText');
      const logContainer = document.getElementById('logContainer');
      const flashOverlay = document.getElementById('flashOverlay');
      const flashEmoji = document.getElementById('flashEmoji');
      const flashText = document.getElementById('flashText');

      micBtn.addEventListener('click', () => {
        if (!isListening) {
          recognition.start();
          startTime = new Date();
          isListening = true;
          micBtn.textContent = "🛑 測定中（テレビに向かって叫んで！）";
          micBtn.classList.add('listening');
        } else {
          isListening = false;
          recognition.stop();
          micBtn.textContent = "🎙️ 動画再生と同時にスタート";
          micBtn.classList.remove('listening');
        }
      });

      // アニキ案：再スタート時に少し間を置き、連続起動による音の鳴りっぱなしを防ぐ
      recognition.onend = () => {
        if (isListening) {
          setTimeout(() => {
            if (isListening) {
              try { recognition.start(); } catch(e){}
            }
          }, 300);
        }
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            const rawText = event.results[i][0].transcript.trim();
            if (rawText.length > 0) {
              processSpeech(rawText);
            }
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        interimText.textContent = interim ? `🎤 聞き取り中: ${interim}` : '🎤 テレビに向かって叫んで！';
      };

      function processSpeech(rawText) {
        let matched = null;

        for (const item of DICTIONARY) {
          for (const kw of item.keywords) {
            if (rawText.includes(kw)) {
              matched = {
                emoji: item.emoji,
                bg: item.bg,
                tag: `#${kw}`,
                rawText: rawText // 音声認識の原文をそのまま保持
              };
              break;
            }
          }
          if (matched) break;
        }

        if (!matched) {
          matched = {
            emoji: "🤖",
            bg: "#2ed573",
            tag: "#ボイス",
            rawText: rawText
          };
        }

        triggerFlash(matched);
        addLog(matched);
      }

      function triggerFlash(data) {
        flashEmoji.textContent = data.emoji;
        flashText.textContent = data.rawText;
        flashOverlay.style.background = data.bg + "ee";
        flashOverlay.classList.add('active');

        setTimeout(() => {
          flashOverlay.classList.remove('active');
        }, 600);
      }

      function addLog(data) {
        const now = new Date();
        const diffSec = Math.floor((now - startTime) / 1000);
        const min = String(Math.floor(diffSec / 60)).padStart(2, '0');
        const sec = String(diffSec % 60).padStart(2, '0');
        const timeStr = `${min}:${sec}`;

        const item = document.createElement('div');
        item.className = 'log-item';
        
        // ChatGPT案：画面上も「原文（しゃべった声）」と「判定タグ」を明確に分けて表示
        item.innerHTML = `
          <div class="log-time">${timeStr}</div>
          <div class="log-emoji">${data.emoji}</div>
          <div class="log-body">
            <div class="log-text">${data.rawText}</div>
            <div class="log-tag">${data.tag}</div>
          </div>
        `;

        if (logContainer.children.length === 1 && logContainer.children[0].tagName === 'DIV' && logContainer.children[0].style.textAlign === 'center') {
          logContainer.innerHTML = '';
        }

        logContainer.insertBefore(item, logContainer.firstChild);
      }
    }
  </script>
</body>
</html>
